<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changelog — Chinese Culture Lab</title>
<meta name="description" content="What's new at Chinese Culture Lab — release history, new experiments, improvements.">
<link rel="canonical" href="https://chinesefortunetools.online/changelog/">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1a2e">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HY5MJJP86Z"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-HY5MJJP86Z');</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:monospace;background:#0d1117;color:#e6edf3;min-height:100vh;}
.hero{background:#161b22;border-bottom:1px solid #30363d;padding:40px 20px;text-align:center;}
.hero h1{font-size:1.6rem;color:#e6edf3;margin-bottom:6px;}
.hero p{color:#8b949e;font-size:0.85rem;}
.main{max-width:720px;margin:0 auto;padding:36px 20px;}
.release{margin-bottom:36px;border-left:3px solid #30363d;padding-left:20px;position:relative;}
.release.latest{border-left-color:#3fb950;}
.release-dot{width:10px;height:10px;border-radius:50%;background:#30363d;position:absolute;left:-7px;top:4px;}
.release.latest .release-dot{background:#3fb950;}
.release-tag{font-size:0.8rem;font-weight:bold;color:#3fb950;margin-bottom:2px;}
.release-name{font-size:1.1rem;color:#e6edf3;margin-bottom:4px;}
.release-date{font-size:0.75rem;color:#484f58;margin-bottom:12px;}
.release-body{font-size:0.82rem;color:#8b949e;line-height:1.7;white-space:pre-wrap;background:#161b22;border:1px solid #21262d;border-radius:6px;padding:14px;}
.release-link{display:inline-block;margin-top:10px;font-size:0.78rem;color:#58a6ff;text-decoration:none;}
.release-link:hover{text-decoration:underline;}
.nav{text-align:center;padding:20px;font-size:0.8rem;color:#484f58;}
.nav a{color:#58a6ff;text-decoration:none;margin:0 8px;}
.empty{text-align:center;padding:60px 20px;color:#484f58;}
</style>
</head>
<body>
<div class="hero">
  <h1>📋 Changelog</h1>
  <p>Every release, experiment, and improvement — automatically generated from GitHub.</p>
</div>

<div class="main" id="main">
  <div class="empty">Loading releases…</div>
</div>

<div class="nav">
  <a href="/">← Home</a>
  <a href="https://github.com/daligao/year-of-goat-2027/releases">GitHub Releases</a>
  <a href="/api/">Open API</a>
</div>

<script>
fetch('/data/changelog-releases.json').then(r=>r.json()).then(function(d){
  var main = document.getElementById('main');
  if (!d.releases || !d.releases.length) {
    main.innerHTML = '<div class="empty">No releases yet. First release coming soon.</div>';
    return;
  }
  main.innerHTML = d.releases.map(function(r, i) {
    return '<div class="release' + (i===0?' latest':'') + '">'
      + '<div class="release-dot"></div>'
      + '<div class="release-tag">' + r.tag + '</div>'
      + '<div class="release-name">' + r.name + '</div>'
      + '<div class="release-date">' + r.date + '</div>'
      + '<div class="release-body">' + (r.body || '').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>'
      + '<a class="release-link" href="' + r.url + '" target="_blank">View on GitHub →</a>'
      + '</div>';
  }).join('');
}).catch(function(){
  document.getElementById('main').innerHTML = '<div class="empty">Releases will appear here after the first monthly build.</div>';
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
