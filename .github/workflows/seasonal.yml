name: Seasonal Theme

on:
  schedule:
    - cron: '0 1 * * *'   # Daily 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seasonal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect season and write season.json
        run: |
          python3 - <<'PYEOF'
          import datetime, json

          today = datetime.date.today()
          CNY   = {2027: datetime.date(2027,2,6),  2026: datetime.date(2026,2,17), 2025: datetime.date(2025,1,29)}
          MA    = {2026: datetime.date(2026,9,25),  2027: datetime.date(2027,10,15)}
          DB    = {2026: datetime.date(2026,6,19),  2027: datetime.date(2027,6,9)}

          year = today.year
          cny  = CNY.get(year) or CNY.get(year-1)
          season = "default"
          if cny:
              delta = (today - cny).days
              if -30 <= delta <= -1:  season = "pre_cny"
              elif 0 <= delta <= 15:  season = "cny"
              elif 16 <= delta <= 30: season = "post_cny"
          if MA.get(year) and abs((today - MA[year]).days) <= 3:  season = "mid_autumn"
          if DB.get(year) and abs((today - DB[year]).days) <= 2:  season = "dragon_boat"

          THEMES = {
              "default":     {"--gold":"#c9a84c","--ink":"#1a1a2e","--red":"#c0392b","--parchment":"#fdf6e3","badge":"Chinese Culture Lab","hero_note":""},
              "pre_cny":     {"--gold":"#FFD700","--ink":"#8B0000","--red":"#DC143C","--parchment":"#fff8e1","badge":"🏮 CNY 2027 Countdown","hero_note":"Chinese New Year is coming!"},
              "cny":         {"--gold":"#FFD700","--ink":"#8B0000","--red":"#DC143C","--parchment":"#fff5f5","badge":"🎊 Happy New Year 新年快乐","hero_note":"恭喜发财 · Happy Year of the Goat!"},
              "post_cny":    {"--gold":"#c9a84c","--ink":"#1a1a2e","--red":"#c0392b","--parchment":"#fdf6e3","badge":"🧧 Post-CNY","hero_note":""},
              "mid_autumn":  {"--gold":"#F4A460","--ink":"#2F4F4F","--red":"#8B4513","--parchment":"#fff8dc","badge":"🥮 Mid-Autumn Festival","hero_note":"Happy Mid-Autumn Festival!"},
              "dragon_boat": {"--gold":"#228B22","--ink":"#1a1a2e","--red":"#006400","--parchment":"#f0fff0","badge":"🐉 Dragon Boat Festival","hero_note":"端午节快乐!"},
          }

          existing = {}
          try:
              existing = json.load(open("data/season.json"))
          except: pass

          if existing.get("season") == season:
              print(f"Season unchanged: {season}")
              exit(0)

          with open("data/season.json", "w") as f:
              json.dump({"season": season, "date": str(today), "theme": THEMES[season]}, f, indent=2)
          print(f"Season changed: {existing.get('season','?')} → {season}")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/season.json
          git diff --staged --quiet || git commit -m "chore: season → $(python3 -c \"import json; print(json.load(open('data/season.json'))['season'])\")" && git push
