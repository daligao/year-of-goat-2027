name: Site Build

on:
  push:
    paths:
      - 'data/tools.json'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'update-sitemap'
        type: choice
        options:
          - update-sitemap
          - list-tools
          - check-all

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run build script
        run: python3 scripts/build.py ${{ github.event.inputs.action || 'update-sitemap' }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "chore: auto-update sitemap from tools.json [skip ci]"
          git push
