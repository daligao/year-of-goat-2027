name: Site Build

on:
  push:
    paths:
      - 'data/tools.json'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'update-sitemap'
        type: choice
        options:
          - update-sitemap
          - list-tools
          - check-all

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build script
        run: python3 scripts/build.py ${{ github.event.inputs.action || 'update-sitemap' }}

      - name: Build Pagefind search index
        run: |
          npm install -g pagefind
          npx pagefind --site . --output-path _pagefind --glob "**/*.html"
          echo "Pagefind index built."

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml _pagefind/
          git diff --staged --quiet || git commit -m "chore: rebuild sitemap + Pagefind index [skip ci]"
          git push
