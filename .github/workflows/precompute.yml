name: Pre-compute Lunar Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 1 *'   # Once a year, Jan 1 — update the _updated timestamp

permissions:
  contents: write

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate lunar-dates.json
        run: python3 scripts/precompute.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lunar-dates.json
          git diff --staged --quiet || git commit -m "data: regenerate lunar-dates.json [skip ci]"
          git push
