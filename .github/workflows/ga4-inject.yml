name: Inject GA4 across static pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/inject_ga4.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ga4-static-injection
  cancel-in-progress: false

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inject GA4
        run: python3 scripts/inject_ga4.py

      - name: Commit GA4 updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --staged --quiet; then
            echo "No GA4 changes needed."
            exit 0
          fi
          git commit -m "analytics: add GA4 G-HY5MJJP86Z across static pages"
          git pull --rebase origin main
          git push origin main
