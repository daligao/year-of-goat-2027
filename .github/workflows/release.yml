name: Auto Release Notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.1)'
        required: true
  schedule:
    - cron: '0 9 1 * *'   # 1st of every month — auto-release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            MONTH=$(date +%Y.%m)
            echo "tag=v${MONTH}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline --no-merges | grep -v '\[skip ci\]' | head -20)
          else
            COMMITS=$(git log --oneline --no-merges -20 | grep -v '\[skip ci\]')
          fi

          # Count experiments from tools.json
          TOOL_COUNT=$(python3 -c "import json; d=json.load(open('data/tools.json')); print(len(d['tools']))")
          LAB_PAGES=$(find 2027/ -name "index.html" 2>/dev/null | wc -l | tr -d ' ')

          BODY="## Chinese Culture Lab ${TAG}

**Experiments running:** ${TOOL_COUNT} tools · **Programmatic pages:** ${LAB_PAGES}

### Changes since last release

\`\`\`
${COMMITS}
\`\`\`

### Endpoints
- 🌐 [Lab homepage](https://chinesefortunetools.online/)
- 📦 [Open API](https://chinesefortunetools.online/api/)
- ⚗️ [Lab tier](https://chinesefortunetools.online/lab/)
- 🔧 [Beta tier](https://chinesefortunetools.online/beta/)

---
*Auto-generated by release.yml*"

          gh release create "$TAG" \
            --title "Chinese Culture Lab ${TAG}" \
            --notes "$BODY" \
            --latest 2>/dev/null || echo "Tag may already exist"

      - name: Update /changelog/ page from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, urllib.request, os, datetime

          TOKEN = os.environ.get('GH_TOKEN', '')
          def api(path):
              req = urllib.request.Request(
                  f'https://api.github.com{path}',
                  headers={'Authorization': f'Bearer {TOKEN}', 'Accept': 'application/vnd.github+json'}
              )
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.loads(r.read())

          try:
              releases = api('/repos/daligao/year-of-goat-2027/releases?per_page=10')
          except Exception as e:
              print(f"Error: {e}"); exit(0)

          items = [{'tag': r['tag_name'], 'name': r['name'], 'date': r['published_at'][:10], 'body': r['body'], 'url': r['html_url']} for r in releases]

          with open('data/changelog-releases.json', 'w') as f:
              json.dump({'updated': str(datetime.date.today()), 'releases': items}, f, indent=2)
          print(f"Synced {len(items)} releases → data/changelog-releases.json")
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/changelog-releases.json
          git diff --staged --quiet || git commit -m "data: update changelog-releases.json [skip ci]"
          git push
