name: AI Content Growth

on:
  schedule:
    - cron: '37 1 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-content-growth
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest AI article and render safe HTML
        run: |
          python3 scripts/publish_ai_content.py \
            --endpoint "https://cft-online-seo-bot.love0972.workers.dev/content/latest"

      - name: Rebuild sitemap
        run: python3 scripts/build.py update-sitemap

      - name: Rebuild Pagefind index
        run: |
          npm install -g pagefind
          npx pagefind --site . --output-path _pagefind --glob "**/*.html"

      - name: Publish generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learn/ data/ai-content-log.json sitemap.xml _pagefind/
          if git diff --staged --quiet; then
            echo "No new AI article to publish."
            exit 0
          fi
          git commit -m "content: publish automated culture guide"
          git push origin main
