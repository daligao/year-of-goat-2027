name: Phase 1 validation
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [codex/online-v2-phase1]
permissions:
  contents: read
concurrency:
  group: phase1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-phase1.txt
      - run: python -m pip install -r requirements-phase1.txt
      - run: python scripts/validate-content.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build-content.py && python scripts/build-site.py
      - run: python scripts/verify-safety.py
      - run: python scripts/validate-seo.py
      - run: python scripts/check-seo-regressions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-seo-report
          path: reports/seo/latest.*
          retention-days: 14
